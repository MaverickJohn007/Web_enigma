<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de edad</title>
</head>
<body>
    <script>
        let año=Number(prompt("Ingrese su año de nacimento: "));

        let edad;
        edad= (2026-año)

        document.write("Su año de nacimiento es en el año: " +año + "<br>");
        document.write("La edad aproximada que deberia tener es de: " + edad + " años" + "<br>");



    </script>





</body>
</html>
