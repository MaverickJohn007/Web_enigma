<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion de soles a dolares</title>
</head>
<body>
    <script>
        let monto=Number(prompt("Ingrese la cantidad de dinero a cambiar: "));
        let cambio=3.89;
        let total;
        total=(monto/cambio)
        total=Number(total.toFixed(2))


        document.write("El monto ingresado es de: S/" + monto + "<br>");
        document.write("EL tipo de cambio esta en : " + cambio + "<br>");
        document.write("El total de la conversion es de : USD$" + total  + "<br>");



    </script>





</body>
</html>
