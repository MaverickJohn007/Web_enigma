<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promedio de notas</title>
</head>
<body>
    <script>
        let nota01=Number(prompt("Ingrese la nota de su primera evaluacion: "));
        let nota02=Number(prompt("Ingrese la nota de su segunda evaluacion: "));
        let nota03=Number(prompt("Ingrese la nota de su tercera evaluacion: "));

        let promedio;
        promedio= (nota01*0.25+nota02*0.35+nota03*0.40)
        promedio =Number(promedio.toFixed(2))

        document.write("Nota de primera evalucion: " + nota01 + "<br>");
        document.write("Nota de la segunda evaluacion: " + nota02 + "<br>");
        document.write("Nota de la tercera evaluacion: " + nota03 + "<br>");
        document.write("Su nota final es de: " + promedio + "<br>" + "<br>");
        document.write("Recordar que el total de las evaluaciones se calcula de la siguiente manera:" + "<br>" + "promedio:(E1*0.25+E2*0.35+E3*0.40)");

    </script>





</body>
</html>
