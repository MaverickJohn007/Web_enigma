<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sueldo de un trabajador</title>
</head>
<body>
    <script>
        let sueldo=Number(prompt("Ingrese su Sueldo Bruto: "));
        let descuento=0.15;
        let descontado;
        let total;

        descontado=(sueldo*descuento)
        total= (sueldo-descontado)

        document.write("Sueldo Bruto: S/" + sueldo + "<br>");
        document.write("Monto descontado(15%): S/" + descontado + "<br>");
        document.write("Sueldo Final: S/" + total + "<br>");

    </script>







</body>
</html>
