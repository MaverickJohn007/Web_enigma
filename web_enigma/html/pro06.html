<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta de una cena</title>
</head>
<body>
    <script>
        let monto=Number(prompt("Ingresa el total de la cuenta a pagar; "));
        let personas=Number(prompt("Ingresa la cantida de personas en la mesa: "));
        let division;
        division=(monto/personas)
        division=Number(division.toFixed(2))

        document.write("El total de la cuenta es de: S/" + monto + "<br>")
        document.write("El total de personas es de: " + personas + "<br>")
        document.write("Cada persona deberia pagar en total: S/" + division + "<br>")

    </script>






</body>
</html>
