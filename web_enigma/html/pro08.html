<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo de combustible</title>
</head>
<body>
    <script>
        let cantidad=Number(prompt("Ingrese la cantida de kilometros que desea recorrer: "));
        let kilometrosxgalon=40;

        let galones;
        galones= (cantidad/kilometrosxgalon)
        galones=Number(galones.toFixed(2))

        document.write("Cantidad de kilometros que desea recorrer es de: " + cantidad + " KM" + "<br>");
        document.write("Cantidad de kilometros por cada galon: " + kilometrosxgalon + " KM" + "<br>");
        document.write("Cantidad de galones necesarios es de: " + galones + " galones" + "<br>");


    </script>



</body>
</html>
