<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descuento en una tienda</title>
</head>
<body>
    <script>
        let precio= Number(prompt("Ingrese el precio del producto deseado: "));
        let descuento= 0.15;

        let totaldescuento;
        let total;
        totaldescuento= (precio*descuento)
        total=(precio-totaldescuento)

        document.write("El precio del producto es de: S/" + precio + "<br>");
        document.write("El descuento del 15% reduce el precio en: S/" + totaldescuento + "<br>");
        document.write("El total a pagar es de : S/" + total + "<br>");



    </script>    












</body>
</html>
