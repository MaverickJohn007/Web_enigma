<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra en una Vodega</title>
</head>
<body>
    <script>
        let precio = Number(prompt("Ingrese el precio de una gaseosa: "));
        let cantidad =Number(prompt("Ingrese la cantidad de gaseosas que desea comprar: "));
        


        let resultado;
        resultado=(precio*cantidad)

        document.write("El precio de una gaseosa es de: S/" + precio + "<br>");
        document.write("El numero de gaseosas pedido es de: " + cantidad + "<br>");
        document.write("El precio total de la compra es de: S/" + resultado + "<br>");
    </script>
    



</body>
</html>
