<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto para un viaje</title>
</head>
<body>
    <script>
        let dias=Number(prompt("Ingrese el total de dias de viaje: "));
        let alimentacion=Number(prompt("Ingrese los gastos diarios en Alimentacion: "));
        let transporte=Number(prompt("Ingrese los gastos diarios es Transporte: "));
        let alojamiento=Number(prompt("Ingrese los gastos diarios en Alojamiento: "));
        let total_aliemtacion;
        total_aliemtacion=(alimentacion*dias)

        let total_transporte;
        total_transporte=(transporte*dias)

        let total_alojamiento;
        total_alojamiento=(alojamiento*dias)

        let total_presupuesto;
        total_presupuesto=(total_aliemtacion+total_alojamiento+total_transporte)


        document.write("Dias total de viaje: " + dias + "<br>");
        document.write("Gasto total en alimentacion: S/" +  total_aliemtacion + "<br>");
        document.write("Gasto total en trasnporte: S/" + total_transporte + "<br>");
        document.write("Gasto total en alojamiento: S/" + total_alojamiento + "<br>");
        document.write("Presupuesto total del viaje: S/" + total_presupuesto + "<br>");



    </script>




</body>
</html>
